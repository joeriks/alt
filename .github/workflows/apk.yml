name: Bygg APK

on:
  push:
    branches: [main]
    paths: ['shell/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --build-number ${{ github.run_number }}

      - name: Publicera som release "senaste"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk alt.apk
          gh release delete senaste --yes --cleanup-tag || true
          gh release create senaste alt.apk \
            --title "alt, bygge ${{ github.run_number }}" \
            --notes "Byggd från ${GITHUB_SHA::7}. Öppna på telefonen och installera alt.apk." \
            --prerelease
